# Unpinned counterpart of environments/rb5. The pinned Manifest there was
# resolved against Julia 1.10 and will not precompile on a much newer Julia, so
# a machine running its own Julia resolves these bounds itself instead. Use
# environments/rb5 whenever reproducing recorded results.
